<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER:LC 3D View Simulator - سلومي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; margin: 0; overflow: hidden; user-select: none; }
        .roblox-glass { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
        
        /* تأثير عمق الأبعاد الثلاثية للشارع والخلفية */
        .perspective-container {
            perspective: 1200px;
            transform-style: preserve-3d;
        }
        .world-plane {
            transform: rotateX(35deg) scale(1.1);
            transform-origin: bottom center;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.08) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(255,255,255,0.08) 2px, transparent 2px);
            background-size: 100px 100px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between">

    <!-- الشريط العلوي المطابق للعبة الأصلية -->
    <header class="roblox-glass px-5 py-3 flex justify-between items-center z-50 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <button onclick="alert('إعدادات اللعبة')" class="bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm border border-slate-700">⚙️</button>
            <button onclick="alert('متجر الأكواد')" class="bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm border border-slate-700">🛒</button>
            <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-3 py-1.5 rounded-xl border border-amber-500/20">Liberty County 3D Mode</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="roblox-glass px-4 py-1.5 rounded-2xl flex items-center gap-2 border border-slate-700">
                <span class="text-emerald-400 font-bold">💵</span>
                <span id="cashDisplay" class="text-emerald-400 font-black text-base">4,368 $</span>
            </div>
            <div class="roblox-glass px-4 py-1.5 rounded-2xl flex items-center gap-2 border border-slate-700 text-xs font-bold text-slate-300">
                <span>🕒</span>
                <span>10:48 صباحًا</span>
            </div>
        </div>
    </header>

    <!-- منطقة اللعب بمنظور الأبعاد (3D Perspective View) -->
    <div class="flex-1 relative overflow-hidden bg-slate-950 perspective-container flex items-center justify-center">
        
        <!-- أرضية الشارع والمدينة المجسمة -->
        <div class="absolute inset-0 world-plane bg-slate-900 border-4 border-slate-800 flex items-center justify-center">
            <!-- خطوط الشارع الوسطية -->
            <div class="absolute w-full h-32 bg-slate-950 border-y-4 border-slate-700 flex items-center justify-around">
                <div class="w-24 h-2 bg-amber-400"></div>
                <div class="w-24 h-2 bg-amber-400"></div>
                <div class="w-24 h-2 bg-amber-400"></div>
            </div>
        </div>

        <!-- أهداف يومية على اليسار مثل الصورة -->
        <div class="absolute top-4 left-4 roblox-glass p-4 rounded-2xl w-72 z-40 border border-slate-700">
            <h4 class="text-xs font-bold text-amber-400 mb-2 border-b border-slate-800 pb-1.5">الأهداف اليومية (Daily Goals)</h4>
            <div class="space-y-2 text-xs text-slate-300">
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="accent-emerald-500 w-4 h-4"> Cuff a Criminal (0/1)</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked disabled class="accent-emerald-500 w-4 h-4"><span class="line-through text-slate-500">Drive 5 Miles (5/5)</span></label>
            </div>
        </div>

        <!-- أزرار الأدوات الجانبية -->
        <div class="absolute left-4 top-44 flex flex-col gap-2.5 z-40">
            <button onclick="togglePhone()" class="roblox-glass hover:bg-slate-800 w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-xl border border-slate-700 transition active:scale-95" title="الجوال">📱</button>
            <button onclick="toggleVehicleMode()" id="carSwitchBtn" class="roblox-glass hover:bg-slate-800 w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-xl border border-slate-700 transition active:scale-95" title="السيارة">🚗</button>
        </div>

        <!-- شخصية اللاعب المجسمة في المنتصف (منظور خلفي 3D) -->
        <div id="playerEntity" class="absolute z-30 transition-all duration-100 flex flex-col items-center" style="bottom: 30%; left: 50%; transform: translateX(-50%);">
            <div id="playerAvatar" class="text-6xl filter drop-shadow-[0_20px_20px_rgba(0,0,0,0.9)] animate-bounce">🧍‍♂️</div>
            <div class="roblox-glass text-slate-100 text-[11px] px-3.5 py-1 rounded-full mt-1 border border-slate-700 font-bold shadow-2xl flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>سلومي (Roleplay)</span>
            </div>
        </div>

        <!-- زر تفاعل قيادة السيارة بالأسفل -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-40">
            <button onclick="toggleVehicleMode()" id="bottomInteractBtn" class="roblox-glass hover:bg-slate-800 px-8 py-3.5 rounded-2xl font-black text-amber-400 border border-slate-600 shadow-2xl transition active:scale-95 text-sm flex items-center gap-2">
                <span>🚗</span> ركوب السيارة والتحرك بالشارع
            </button>
        </div>
    </div>

    <script>
        let posX = window.innerWidth / 2;
        let posY = window.innerHeight * 0.6;
        let isDriving = false;
        const playerEntity = document.getElementById("playerEntity");
        const playerAvatar = document.getElementById("playerAvatar");
        const carSwitchBtn = document.getElementById("carSwitchBtn");
        const bottomInteractBtn = document.getElementById("bottomInteractBtn");

        window.addEventListener('keydown', (e) => {
            const speed = 15;
            if (e.key === 'ArrowLeft' || e.key === 'a') posX = Math.max(100, posX - speed);
            if (e.key === 'ArrowRight' || e.key === 'd') posX = Math.min(window.innerWidth - 100, posX + speed);
            if (e.key === 'ArrowUp' || e.key === 'w') posY = Math.max(200, posY - speed);
            if (e.key === 'ArrowDown' || e.key === 's') posY = Math.min(window.innerHeight - 150, posY + speed);

            playerEntity.style.left = posX + 'px';
            playerEntity.style.top = posY + 'px';
        });

        function toggleVehicleMode() {
            isDriving = !isDriving;
            if (isDriving) {
                playerAvatar.innerText = "🚙";
                carSwitchBtn.innerText = "🚶‍♂️";
                bottomInteractBtn.innerHTML = "<span>🚶‍♂️</span> الترجل من السيارة";
                bottomInteractBtn.className = "roblox-glass hover:bg-red-950 px-8 py-3.5 rounded-2xl font-black text-red-400 border border-red-600/50 shadow-2xl transition active:scale-95 text-sm flex items-center gap-2";
            } else {
                playerAvatar.innerText = "🧍‍♂️";
                carSwitchBtn.innerText = "🚗";
                bottomInteractBtn.innerHTML = "<span>🚗</span> ركوب السيارة والتحرك بالشارع";
                bottomInteractBtn.className = "roblox-glass hover:bg-slate-800 px-8 py-3.5 rounded-2xl font-black text-amber-400 border border-slate-600 shadow-2xl transition active:scale-95 text-sm flex items-center gap-2";
            }
        }

        function togglePhone() {
            alert("تم فتح جوال الطوارئ بنجاح!");
        }
    </script>
</body>
</html>
